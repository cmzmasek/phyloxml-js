# Publishes the package to npm whenever a GitHub Release is published.
# Requires an npm token with publish rights stored as the repo secret
# NPM_TOKEN (Settings -> Secrets and variables -> Actions -> New repository
# secret). It must be an automation token, or a granular token with "bypass
# 2FA" enabled: npm refuses a direct publish otherwise, whatever the account's
# own 2FA setting says.
#
# The workflow_dispatch trigger lets you publish from the Actions tab without
# creating a release.

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # enables npm provenance
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Sanity check: fail early if the release tag does not match package.json.
      # Tag format expected: v1.0.1
      - name: Verify version matches tag
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi

      # The sax dependency is a git URL rather than a registry range, so the
      # install needs git and can be slow; --ignore-scripts keeps it honest.
      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
